/* Guidebook del anfitrión: pantalla externa a la app (se abre desde la Home). Mismo lenguaje: gris claro, tarjetas blancas sin borde ni sombra, marino #161643, azul #385bf8, Poppins. */
:root{--navy:#161643;--blue:#385bf8;--sec:#6b6b95;--soft:#f1f3fb;--line:#eceef6}
*{box-sizing:border-box}
html,body{margin:0;background:#f4f4f8;color:var(--navy);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

.top-in{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;padding:12px 16px}

.hi{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:16px}

.meta{margin:2px 0 0;font-size:13px;color:var(--sec)}

.toc a{flex:none;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:9999px;background:#fff;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.toc a:hover{background:var(--soft)}
.chap{margin:12px 0 0;display:flex;align-items:center;gap:12px}
.chap .hi{width:40px;height:40px;border-radius:12px}
.chap b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.card{padding:20px 16px;border-radius:18px;background:#fff;scroll-margin-top:72px}
.card h2{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:16px;line-height:22px;font-weight:700}
.card h2 i{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(56,91,248,.16);color:var(--blue);font-style:normal;font-size:13px;font-weight:700}
.card p{margin:0 0 12px;font-size:14.5px;line-height:23px}.card p:last-child{margin-bottom:0}
.card ol,.card ul{margin:0 0 12px;padding-left:20px;font-size:14.5px;line-height:23px}.card li+li{margin-top:6px}
.kv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--soft)}.kv+.kv{margin-top:8px}
.kv span{flex:1;min-width:0}.kv small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.kv code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:500;letter-spacing:.02em;overflow-wrap:anywhere}
.cp{flex:none;height:32px;padding:0 16px;border:0;border-radius:9999px;background:rgba(56,91,248,.16);color:var(--blue);font-size:12.5px;font-weight:600}.cp.ok{background:rgba(55,224,143,.26);color:#0b5c37}
.note{display:flex;gap:12px;align-items:flex-start;margin:12px 0 0;padding:12px;border-radius:14px;background:rgba(255,194,51,.22);font-size:13.5px;line-height:20px;color:#6b4700}
.note svg{flex:none;margin-top:1px;color:#7a5200}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 20px;margin-top:4px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.btn.sec{background:var(--soft);color:var(--blue)}
.foot{margin-top:8px;text-align:center;font-size:12px;color:var(--sec)}
.fg{margin:12px 0 0}.fg img{display:block;width:100%;max-height:220px;object-fit:cover;border-radius:14px}.fg figcaption{margin-top:6px;font-size:12.5px;color:var(--sec)}

.map{display:grid;place-items:center;height:150px;margin-bottom:12px;border-radius:14px;color:var(--blue);background:linear-gradient(135deg,#dfe8ff,#eaf6ee)}
.wx{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:12px;border-radius:14px;background:var(--soft)}.wx b{display:block;font-size:14.5px}.wx small{font-size:12.5px;color:var(--sec)}
.fl{display:flex;align-items:center;gap:12px;margin:8px 0 0;padding:12px;border-radius:14px;background:var(--soft);text-decoration:none}.fl b{display:block;font-size:14px}.fl small{font-size:12px;color:var(--sec)}
@media (min-width:1024px){.wrap{padding-top:24px}.hero{padding:24px}h1{font-size:26px;line-height:32px}}
</style></head><body>
