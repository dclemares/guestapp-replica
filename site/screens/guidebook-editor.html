button{cursor:pointer}

.sp{flex:1}
.vs{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--soft)}
.vs a{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;text-decoration:none;color:var(--sec)}.vs a.on{background:#fff;color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--soft);font-size:13.5px;font-weight:600}
.btn.pri{background:var(--blue);color:#fff}.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.wrap{max-width:1360px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:16px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700}.card .sub{margin:0 0 12px;font-size:12.5px;line-height:18px;color:var(--sec)}
.lbl{display:block;margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--sec)}
.stack{display:flex;flex-direction:column;gap:12px}

.bl-h{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--blue)}
.bl-b{flex:1;min-width:0}.bl-t{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sec)}
.bl-c{margin-top:2px;font-size:14px;line-height:20px;overflow-wrap:anywhere}.bl-c b{font-weight:700}
.bl-c.h{font-size:17px;font-weight:700;letter-spacing:-.01em}
.bl-c img{display:block;width:100%;max-width:360px;height:120px;object-fit:cover;border-radius:10px;margin-top:6px}
.bl-c .pill{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 10px;border-radius:9999px;background:var(--soft);font-size:12.5px;font-weight:600}
